<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checklist Inspección Maquinaria - Elecnor</title>
  <style>
    :root {
      --elecnor-azul: #002255;
      --elecnor-azul-oscuro: #001536;
      --elecnor-naranja: #F35000;
      --elecnor-naranja-hover: #d94600;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(135deg, var(--elecnor-azul) 0%, var(--elecnor-azul-oscuro) 100%);
      min-height: 100vh;
      margin: 0;
      padding: 15px;
      color: #333;
      box-sizing: border-box;
    }

    .container {
      max-width: 700px;
      margin: 0 auto;
      background: #ffffff;
      padding: 24px;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
      border-top: 5px solid var(--elecnor-naranja);
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid var(--elecnor-azul);
      padding-bottom: 12px;
      margin-bottom: 20px;
    }

    h2 {
      color: var(--elecnor-azul);
      margin: 0;
      font-size: 1.35rem;
    }

    h3 {
      color: var(--elecnor-azul);
      border-bottom: 2px solid var(--elecnor-naranja);
      padding-bottom: 6px;
      margin-top: 22px;
    }

    .form-group {
      margin-bottom: 15px;
    }

    label {
      display: block;
      font-weight: 600;
      margin-bottom: 5px;
      font-size: 0.9rem;
      color: var(--elecnor-azul);
    }

    input[type="text"], input[type="password"], input[type="email"], select {
      width: 100%;
      padding: 10px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      box-sizing: border-box;
      font-size: 1rem;
    }

    input:focus, select:focus {
      outline: none;
      border-color: var(--elecnor-naranja);
      box-shadow: 0 0 0 2px rgba(243, 80, 0, 0.15);
    }

    .check-item {
      border: 1px solid #e2e8f0;
      border-left: 4px solid var(--elecnor-azul);
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 12px;
      background: #f8fafc;
    }

    .check-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .btn-group {
      display: flex;
      gap: 6px;
    }

    .btn-estado {
      padding: 8px 14px;
      border: 1px solid #cbd5e1;
      border-radius: 5px;
      cursor: pointer;
      font-weight: bold;
      background: #fff;
      transition: all 0.2s;
    }

    .btn-estado.apto.active {
      background: #28a745;
      color: #fff;
      border-color: #28a745;
    }

    .btn-estado.no-apto.active {
      background: #dc3545;
      color: #fff;
      border-color: #dc3545;
    }

    .fallo-box {
      display: none;
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px dashed #cbd5e1;
    }

    .preview-img {
      max-width: 150px;
      margin-top: 8px;
      border-radius: 5px;
      display: none;
      border: 1px solid #ccc;
    }

    canvas {
      border: 1px solid #94a3b8;
      border-radius: 6px;
      width: 100%;
      height: 140px;
      touch-action: none;
      background: #fff;
    }

    .btn-primary {
      width: 100%;
      padding: 14px;
      background: var(--elecnor-naranja);
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 1.05rem;
      font-weight: bold;
      cursor: pointer;
      margin-top: 15px;
      transition: background 0.2s;
    }

    .btn-primary:hover {
      background: var(--elecnor-naranja-hover);
    }

    .btn-primary:disabled {
      background: #94a3b8;
      cursor: not-allowed;
    }

    .btn-small {
      background: var(--elecnor-azul);
      color: #fff;
      border: none;
      padding: 5px 10px;
      border-radius: 4px;
      font-size: 0.8rem;
      cursor: pointer;
      margin-top: 4px;
    }

    .error-msg {
      color: #dc3545;
      font-size: 0.9rem;
      margin-top: 8px;
      text-align: center;
      font-weight: 500;
    }
  </style>
</head>
<body>

  <!-- PANTALLA DE LOGIN -->
  <div id="login-screen" class="container" style="max-width: 400px; margin-top: 40px;">
    <div style="text-align: center; margin-bottom: 22px;">
      <!-- Logo Elecnor integrado en alta calidad -->
      <svg viewBox="0 0 320 135" width="210" style="display: block; margin: 0 auto 12px auto;" xmlns="http://www.w3.org/2000/svg">
        <path d="M 18,52 C 75,18 165,6 225,22 C 242,27 235,44 228,54 C 248,50 285,42 304,35 C 275,55 242,66 220,62 C 212,60 220,44 226,35 C 175,20 85,26 18,52 Z" fill="#F35000"/>
        <text x="160" y="114" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="68" letter-spacing="2" fill="#002255" text-anchor="middle">elecnor</text>
      </svg>
      <h2>Acceso usuarios Elecnor</h2>
    </div>
    <div class="form-group">
      <label>Usuario</label>
      <input type="text" id="login-user" placeholder="Introduce tu usuario">
    </div>
    <div class="form-group">
      <label>Contraseña</label>
      <input type="password" id="login-pass" placeholder="••••••••">
    </div>
    <button class="btn-primary" id="btn-login" onclick="iniciarSesion()">Iniciar Sesión</button>
    <p id="login-error" class="error-msg"></p>
  </div>

  <!-- APLICACIÓN PRINCIPAL -->
  <div id="app-content" class="container" style="display: none;">
    <div class="header">
      <div>
        <h2>Checklist de Maquinaria</h2>
        <small id="saludo-tecnico" style="color: #475569; font-weight: 600;"></small>
      </div>
      <div style="text-align: right;">
        <!-- Mini Logo Elecnor en cabecera -->
        <svg viewBox="0 0 320 135" width="110" style="display: block; margin-bottom: 4px;" xmlns="http://www.w3.org/2000/svg">
          <path d="M 18,52 C 75,18 165,6 225,22 C 242,27 235,44 228,54 C 248,50 285,42 304,35 C 275,55 242,66 220,62 C 212,60 220,44 226,35 C 175,20 85,26 18,52 Z" fill="#F35000"/>
          <text x="160" y="114" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="68" letter-spacing="2" fill="#002255" text-anchor="middle">elecnor</text>
        </svg>
        <button class="btn-small" onclick="cerrarSesion()">Salir</button>
      </div>
    </div>

    <!-- DATOS GENERALES Y CORREOS -->
    <div class="form-group">
      <label>Identificación de la Máquina / Matrícula</label>
      <input type="text" id="maquina" placeholder="Ej. Plataforma Elevadora JLG-04" required>
    </div>
    <div class="form-group">
      <label>Empresa Propietaria / Subcontrata (creará su carpeta en Drive)</label>
      <input type="text" id="empresa-maquina" placeholder="Nombre exacto de la empresa" required>
    </div>
    <div class="form-group">
      <label>Correo Empresa Propietaria (recibirá el PDF)</label>
      <input type="email" id="email-empresa" placeholder="contacto@empresa.com" required>
    </div>
    <div class="form-group">
      <label>Correo Técnico Prevención (copia del PDF)</label>
      <input type="email" id="email-tecnico" placeholder="tecnico@elecnor.com" required>
    </div>

    <!-- PUNTOS DE INSPECCIÓN -->
    <h3>Puntos de Control</h3>
    <div id="lista-preguntas"></div>

    <!-- RESULTADO GLOBAL -->
    <div class="form-group" style="margin-top: 20px;">
      <label>Dictamen Final de la Máquina</label>
      <select id="resultado-global">
        <option value="APTA">APTA PARA TRABAJAR</option>
        <option value="NO APTA">NO APTA (PARALIZADA)</option>
      </select>
    </div>

    <!-- FIRMAS MANUALES -->
    <div class="form-group">
      <label>Firma Técnico de Prevención (Obligatoria cada vez)</label>
      <canvas id="canvas-tecnico"></canvas>
      <button type="button" class="btn-small" onclick="limpiarFirma('canvas-tecnico')">Borrar firma</button>
    </div>

    <div class="form-group">
      <label>Firma Responsable Subcontrata / Máquina</label>
      <canvas id="canvas-subcontrata"></canvas>
      <button type="button" class="btn-small" onclick="limpiarFirma('canvas-subcontrata')">Borrar firma</button>
    </div>

    <button class="btn-primary" id="btn-enviar" onclick="enviarChecklist()">Generar PDF y Enviar por Correo</button>
    <p id="estado-envio" style="text-align: center; font-weight: bold; margin-top: 10px;"></p>
  </div>

  <script>
    const URL_APPS_SCRIPT = "https://script.google.com/macros/s/AKfycbzLjNj-rar2OgHXxUsqdwiATZJufp1g5EwR7Ry-u_6NdglFC38PWegU67KTQzb9CWcRQw/exec";

    // Lista personalizable de puntos a revisar
    const PREGUNTAS = [
      "Estado general de neumáticos, orugas y estabilizadores",
      "Funcionamiento correcto de mandos, parada de emergencia y claxon",
      "Ausencia de fugas hidráulicas o de combustible",
      "Señalización luminosa (rotativo), acústica de marcha atrás y pegatinas",
      "Documentación al día (Marcado CE, manual en castellano, revisión periódica)"
    ];

    let respuestas = PREGUNTAS.map(p => ({ pregunta: p, estado: "APTO", observacion: "", fotoBase64: "" }));

    // --- GESTIÓN DE SESIÓN ---
    window.onload = function() {
      const usuario = sessionStorage.getItem("tecnicoNombre");
      renderizarPreguntas();
      if (usuario) {
        mostrarApp(usuario);
      }
    };

    function iniciarSesion() {
      const usuario = document.getElementById("login-user").value.trim();
      const password = document.getElementById("login-pass").value.trim();
      const errorMsg = document.getElementById("login-error");
      const btn = document.getElementById("btn-login");

      if (!usuario || !password) {
        errorMsg.textContent = "Rellena usuario y contraseña.";
        return;
      }

      btn.disabled = true;
      errorMsg.textContent = "Comprobando credenciales...";

      fetch(URL_APPS_SCRIPT, {
        method: "POST",
        body: JSON.stringify({ action: "login", usuario, password })
      })
      .then(r => r.json())
      .then(res => {
        btn.disabled = false;
        if (res.status === "ok") {
          sessionStorage.setItem("tecnicoNombre", res.nombre);
          mostrarApp(res.nombre);
        } else {
          errorMsg.textContent = res.message;
        }
      })
      .catch(() => {
        btn.disabled = false;
        errorMsg.textContent = "Error de conexión con el servidor.";
      });
    }

    function mostrarApp(nombre) {
      document.getElementById("login-screen").style.display = "none";
      document.getElementById("app-content").style.display = "block";
      document.getElementById("saludo-tecnico").textContent = "Técnico: " + nombre;
      // Inicializar paneles de firma justo cuando ya son visibles para evitar desplazamientos del trazo
      inicializarCanvas("canvas-tecnico");
      inicializarCanvas("canvas-subcontrata");
    }

    function cerrarSesion() {
      sessionStorage.removeItem("tecnicoNombre");
      location.reload();
    }

    // --- RENDERIZADO DE PREGUNTAS Y FOTOS DE FALLO ---
    function renderizarPreguntas() {
      const contenedor = document.getElementById("lista-preguntas");
      contenedor.innerHTML = "";
      PREGUNTAS.forEach((texto, idx) => {
        contenedor.innerHTML += `
          <div class="check-item">
            <div class="check-header">
              <span style="font-size: 0.95rem;"><strong>${idx + 1}.</strong> ${texto}</span>
              <div class="btn-group">
                <button type="button" id="btn-apto-${idx}" class="btn-estado apto active" onclick="marcarEstado(${idx}, 'APTO')">APTO</button>
                <button type="button" id="btn-noapto-${idx}" class="btn-estado no-apto" onclick="marcarEstado(${idx}, 'NO APTO')">NO APTO</button>
              </div>
            </div>
            <div id="fallo-box-${idx}" class="fallo-box">
              <input type="text" placeholder="Describe la anomalía detectada..." oninput="respuestas[${idx}].observacion = this.value">
              <label style="margin-top: 8px; font-size: 0.85rem; color: #dc3545;">Adjuntar foto del fallo:</label>
              <input type="file" accept="image/*" capture="environment" onchange="procesarFoto(event, ${idx})">
              <img id="preview-${idx}" class="preview-img">
            </div>
          </div>
        `;
      });
    }

    function marcarEstado(idx, estado) {
      respuestas[idx].estado = estado;
      document.getElementById(`btn-apto-${idx}`).classList.toggle("active", estado === "APTO");
      document.getElementById(`btn-noapto-${idx}`).classList.toggle("active", estado === "NO APTO");
      document.getElementById(`fallo-box-${idx}`).style.display = estado === "NO APTO" ? "block" : "none";
      if (estado === "NO APTO") document.getElementById("resultado-global").value = "NO APTA";
    }

    function procesarFoto(event, idx) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(e) {
        const img = new Image();
        img.onload = function() {
          const canvas = document.createElement("canvas");
          const MAX_WIDTH = 800;
          const scale = MAX_WIDTH / img.width;
          canvas.width = MAX_WIDTH;
          canvas.height = img.height * scale;
          const ctx = canvas.getContext("2d");
          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
          const comprimida = canvas.toDataURL("image/jpeg", 0.7);
          respuestas[idx].fotoBase64 = comprimida;
          const preview = document.getElementById(`preview-${idx}`);
          preview.src = comprimida;
          preview.style.display = "block";
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    // --- PANELES DE FIRMA TÁCTIL ---
    function inicializarCanvas(id) {
      const canvas = document.getElementById(id);
      const ctx = canvas.getContext("2d");
      let dibujando = false;

      function ajustarTamano() {
        const rect = canvas.getBoundingClientRect();
        canvas.width = rect.width;
        canvas.height = rect.height;
        ctx.lineWidth = 2;
        ctx.lineCap = "round";
        ctx.strokeStyle = "#000";
      }
      ajustarTamano();

      const getPos = (e) => {
        const rect = canvas.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        return { x: clientX - rect.left, y: clientY - rect.top };
      };

      const start = (e) => { dibujando = true; const pos = getPos(e); ctx.beginPath(); ctx.moveTo(pos.x, pos.y); };
      const move = (e) => { if (!dibujando) return; e.preventDefault(); const pos = getPos(e); ctx.lineTo(pos.x, pos.y); ctx.stroke(); };
      const end = () => { dibujando = false; };

      canvas.addEventListener("mousedown", start);
      canvas.addEventListener("mousemove", move);
      window.addEventListener("mouseup", end);
      canvas.addEventListener("touchstart", start, { passive: false });
      canvas.addEventListener("touchmove", move, { passive: false });
      canvas.addEventListener("touchend", end);
    }

    function limpiarFirma(id) {
      const canvas = document.getElementById(id);
      canvas.getContext("2d").clearRect(0, 0, canvas.width, canvas.height);
    }

    // --- ENVÍO FINAL ---
    function enviarChecklist() {
      const maquina = document.getElementById("maquina").value.trim();
      const empresaMaquina = document.getElementById("empresa-maquina").value.trim();
      const emailEmpresa = document.getElementById("email-empresa").value.trim();
      const emailTecnico = document.getElementById("email-tecnico").value.trim();
      const apto = document.getElementById("resultado-global").value;
      const estadoEnvio = document.getElementById("estado-envio");
      const btn = document.getElementById("btn-enviar");

      if (!maquina || !empresaMaquina || !emailEmpresa) {
        alert("Por favor, completa los datos de la máquina y el correo de la empresa.");
        return;
      }

      btn.disabled = true;
      estadoEnvio.style.color = "#002255";
      estadoEnvio.textContent = "Generando PDF, subiendo fotos y enviando correos...";

      const payload = {
        action: "submitChecklist",
        fecha: new Date().toLocaleDateString("es-ES"),
        tecnico: sessionStorage.getItem("tecnicoNombre"),
        maquina,
        empresaMaquina,
        emailEmpresa,
        emailTecnico,
        apto,
        items: respuestas,
        firmaTecnico: document.getElementById("canvas-tecnico").toDataURL("image/png"),
        firmaSubcontrata: document.getElementById("canvas-subcontrata").toDataURL("image/png")
      };

      fetch(URL_APPS_SCRIPT, {
        method: "POST",
        body: JSON.stringify(payload)
      })
      .then(r => r.json())
      .then(res => {
        btn.disabled = false;
        if (res.status === "ok") {
          estadoEnvio.style.color = "green";
          estadoEnvio.innerHTML = `¡Informe enviado correctamente! <a href="${res.pdfUrl}" target="_blank">Ver PDF</a>`;
        } else {
          estadoEnvio.style.color = "red";
          estadoEnvio.textContent = "Error: " + res.message;
        }
      })
      .catch(() => {
        btn.disabled = false;
        estadoEnvio.style.color = "red";
        estadoEnvio.textContent = "Error de red al enviar el informe.";
      });
    }
  </script>
</body>
</html>
